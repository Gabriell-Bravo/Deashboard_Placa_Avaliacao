services:
  - type: web
    name: qr-plaquinhas
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        value: admin123
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DATA_DIR
        value: /opt/render/project/src/data
