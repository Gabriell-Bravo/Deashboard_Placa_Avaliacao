{% extends "base.html" %}
{% block title %}Novo QR · QR Plaquinhas{% endblock %}
{% block content %}
<section class="page-head">
  <div>
    <h1>Novo QR Code dinâmico</h1>
    <p class="muted">Gere um código único para a placa. Depois da impressão, você pode trocar o link de destino a qualquer momento.</p>
  </div>
</section>

<form method="post" class="panel form-grid">
  <label>
    Nome da placa *
    <input type="text" name="name" required placeholder="Ex: Restaurante do Lucas" />
  </label>
  <label>
    Cliente
    <input type="text" name="company" placeholder="Ex: Lucas" />
  </label>
  <label class="full">
    Link de destino (Google Avaliações, site, etc.) *
    <input type="text" name="target_url" required placeholder="https://g.page/r/...." />
  </label>
  <label>
    Código personalizado (opcional)
    <input type="text" name="code" placeholder="Deixe vazio para gerar PLACA-8177" pattern="PLACA-[0-9]{4,8}" />
    <span class="help">Formato: PLACA-8177. Este código aparece no QR impresso.</span>
  </label>
  <label class="full">
    Observações
    <textarea name="notes" rows="3" placeholder="Local de instalação, lote de impressão, etc."></textarea>
  </label>
  <div class="form-actions full">
    <a class="btn btn-ghost" href="{{ url_for('dashboard') }}">Cancelar</a>
    <button class="btn btn-primary" type="submit">Criar QR Code</button>
  </div>
</form>
{% endblock %}
